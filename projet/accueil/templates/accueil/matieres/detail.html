{% extends 'accueil/base.html' %}

{% block title %}
Détail matière - {{ matiere.nom }}
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Détail de la matière</h1>
        <p>{{ matiere.nom }}</p>
    </div>
    <a href="{% url 'liste_matieres' %}" class="btn-add">← Retour à la liste</a>
</div>

<div class="form-card">
    <div class="form-grid">

        <div class="form-group">
            <label>Code matière</label>
            <input type="text" value="{{ matiere.code }}" readonly>
        </div>

        <div class="form-group">
            <label>Nom matière</label>
            <input type="text" value="{{ matiere.nom }}" readonly>
        </div>

        <div class="form-group">
            <label>Classe</label>
            <input type="text" value="{{ matiere.classe.nom }}" readonly>
        </div>

        <div class="form-group">
            <label>Coefficient</label>
            <input type="text" value="{{ matiere.coefficient }}" readonly>
        </div>

    </div>

    <div class="form-actions">
        <a href="{% url 'liste_matieres' %}" class="btn-cancel">Retour</a>
        <a href="{% url 'modifier_matiere' matiere.id %}" class="btn-save">Modifier</a>
    </div>
</div>

{% endblock %}
