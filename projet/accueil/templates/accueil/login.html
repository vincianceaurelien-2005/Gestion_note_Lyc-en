<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – Gestion des notes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #2563eb 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        }
        .login-card h1 {
            font-size: 1.5rem;
            color: #0f172a;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-card p.sub {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            border: 1px solid #fecaca;
        }
        .logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🎓</div>
        <h1>Gestion des notes</h1>
        <p class="sub">Connectez-vous pour continuer</p>

        {% if erreur %}
        <div class="alert-error">{{ erreur }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="Votre identifiant">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>
    </div>
</body>
</html>
