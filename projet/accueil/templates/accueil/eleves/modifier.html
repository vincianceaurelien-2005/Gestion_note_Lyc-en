{% extends 'accueil/base.html' %}

{% block title %}
Modifier un élève
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Modifier un élève</h1>
        <p>{{ eleve.nom }} {{ eleve.prenom }}</p>
    </div>
</div>

{% if erreur %}
<div class="alert alert-error" style="background:#fee;color:#c00;padding:12px;border-radius:6px;margin-bottom:16px;">
    {{ erreur }}
</div>
{% endif %}

<div class="form-card">
    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label for="matricule">Matricule</label>
                <input type="text" id="matricule" name="matricule" value="{{ eleve.matricule }}" required>
            </div>

            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" value="{{ eleve.nom }}" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" value="{{ eleve.prenom }}" required>
            </div>

            <div class="form-group">
                <label for="sexe">Sexe</label>
                <select id="sexe" name="sexe" required>
                    <option value="M" {% if eleve.sexe == 'M' %}selected{% endif %}>Masculin</option>
                    <option value="F" {% if eleve.sexe == 'F' %}selected{% endif %}>Féminin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date_naissance">Date de naissance</label>
                <input type="date" id="date_naissance" name="date_naissance" value="{{ eleve.date_naissance|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="classe">Classe</label>
                <select id="classe" name="classe" required>
                    {% for c in classes %}
                    <option value="{{ c.id }}" {% if eleve.classe_id == c.id %}selected{% endif %}>
                        {{ c.nom }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-actions">
            <a href="{% url 'detail_eleve' eleve.id %}" class="btn-cancel">Annuler</a>
            <button type="submit" class="btn-save">Enregistrer</button>
        </div>
    </form>
</div>

{% endblock %}
